apiVersion: v1
kind: Service
metadata:
  name: front-canary
  namespace: terrasense-final
spec:
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: front
    track: canary
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: front-stable
  namespace: terrasense-final
spec:
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: front
    track: stable
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-canary
  namespace: terrasense-final
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front
      track: canary
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: front
        track: canary
        version: 1.1.0
    spec:
      containers:
      - image: terrasense-frontend:1.1.0
        imagePullPolicy: Never
        livenessProbe:
          httpGet:
            path: /version.txt
            port: 3000
          periodSeconds: 15
          timeoutSeconds: 2
        name: front
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /version.txt
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 384Mi
          requests:
            cpu: 100m
            memory: 128Mi
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /version.txt
            port: 3000
          periodSeconds: 5
      terminationGracePeriodSeconds: 30
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-stable
  namespace: terrasense-final
spec:
  replicas: 2
  selector:
    matchLabels:
      app: front
      track: stable
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: front
        track: stable
        version: 1.0.0
    spec:
      containers:
      - image: terrasense-frontend:1.0.0
        imagePullPolicy: Never
        livenessProbe:
          httpGet:
            path: /version.txt
            port: 3000
          periodSeconds: 15
          timeoutSeconds: 2
        name: front
        ports:
        - containerPort: 3000
        readinessProbe:
          httpGet:
            path: /version.txt
            port: 3000
          periodSeconds: 5
          timeoutSeconds: 2
        resources:
          limits:
            cpu: 500m
            memory: 384Mi
          requests:
            cpu: 100m
            memory: 128Mi
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /version.txt
            port: 3000
          periodSeconds: 5
      terminationGracePeriodSeconds: 30
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/cors-allow-headers: Content-Type
    nginx.ingress.kubernetes.io/cors-allow-methods: GET, POST, OPTIONS
    nginx.ingress.kubernetes.io/cors-allow-origin: http://terrasense.local
    nginx.ingress.kubernetes.io/enable-cors: "true"
  name: api
  namespace: terrasense-final
spec:
  ingressClassName: nginx
  rules:
  - host: api.terrasense.local
    http:
      paths:
      - backend:
          service:
            name: backend
            port:
              number: 3000
        path: /
        pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: persistent
    nginx.ingress.kubernetes.io/session-cookie-change-on-failure: "true"
    nginx.ingress.kubernetes.io/session-cookie-max-age: "600"
    nginx.ingress.kubernetes.io/session-cookie-name: TERRASENSE_ROUTE
  name: front
  namespace: terrasense-final
spec:
  ingressClassName: nginx
  rules:
  - host: terrasense.local
    http:
      paths:
      - backend:
          service:
            name: front-stable
            port:
              number: 3000
        path: /
        pathType: Prefix
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/affinity-canary-behavior: sticky
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-cookie: TERRASENSE_QA
    nginx.ingress.kubernetes.io/canary-by-header: X-Canary
    nginx.ingress.kubernetes.io/canary-weight: "0"
  name: front-canary
  namespace: terrasense-final
spec:
  ingressClassName: nginx
  rules:
  - host: terrasense.local
    http:
      paths:
      - backend:
          service:
            name: front-canary
            port:
              number: 3000
        path: /
        pathType: Prefix
