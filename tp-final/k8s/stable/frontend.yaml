apiVersion: apps/v1
kind: Deployment
metadata:
  name: front-stable
  namespace: terrasense-final
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: front, track: stable}
  template:
    metadata:
      labels: {app: front, track: stable, version: "1.0.0"}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: front
          image: terrasense-frontend:1.0.0
          imagePullPolicy: Never
          ports:
            - {containerPort: 3000}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          startupProbe:
            httpGet: {path: /version.txt, port: 3000}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /version.txt, port: 3000}
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet: {path: /version.txt, port: 3000}
            periodSeconds: 15
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: front-stable
  namespace: terrasense-final
spec:
  type: ClusterIP
  selector: {app: front, track: stable}
  ports:
    - {port: 3000, targetPort: 3000}
