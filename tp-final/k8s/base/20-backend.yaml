apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: terrasense-final
spec:
  # First startup must be serial: TypeORM synchronize and the demo seeder run at boot.
  replicas: 1
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend, version: "1.0.0"}
    spec:
      containers:
        - name: backend
          image: terrasense-backend:1.0.0
          imagePullPolicy: Never
          ports:
            - {containerPort: 3000}
          envFrom:
            - configMapRef: {name: app-config}
            - secretRef: {name: postgres-local}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
          startupProbe:
            tcpSocket: {port: 3000}
            periodSeconds: 3
            failureThreshold: 60
          livenessProbe:
            tcpSocket: {port: 3000}
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /metrics/ESP32-INV-01/latest?sensorType=temp,airHum,soilHum,waterLevel
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: terrasense-final
spec:
  type: ClusterIP
  selector: {app: backend}
  ports:
    - {port: 3000, targetPort: 3000}
