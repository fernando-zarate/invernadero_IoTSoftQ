apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: terrasense
  namespace: terrasense
spec:
  ingressClassName: nginx
  rules:
    - host: api.terrasense.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 3000
    - host: terrasense.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
