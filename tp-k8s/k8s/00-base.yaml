apiVersion: v1
kind: Namespace
metadata:
  name: terrasense
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: terrasense
data:
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: terrasense
  NESTJS_PORT: "3000"
---
# Public, disposable local examples ONLY. Never reuse outside this TP.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-local
  namespace: terrasense
type: Opaque
stringData:
  POSTGRES_USER: tp_local
  POSTGRES_PASSWORD: tp_local_not_for_production
